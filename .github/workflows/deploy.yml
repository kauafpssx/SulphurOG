name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Go build
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o /dev/null ./cmd/sulphurog

      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          SCP="scp -i /tmp/deploy_key -o StrictHostKeyChecking=no"
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $USER@$HOST"

          # Garante diretório no servidor
          $SSH "mkdir -p /home/ubuntu/SulphurOG/configs /home/ubuntu/SulphurOG/data"

          # Para container antes de sobrescrever arquivos
          $SSH "cd /home/ubuntu/SulphurOG && docker compose down || true"

          # Envia fontes, Dockerfile, compose e configs
          $SCP docker-compose.yml Dockerfile $USER@$HOST:/home/ubuntu/SulphurOG/
          $SCP -r configs/ $USER@$HOST:/home/ubuntu/SulphurOG/
          $SCP -r internal/ $USER@$HOST:/home/ubuntu/SulphurOG/
          $SCP -r cmd/ $USER@$HOST:/home/ubuntu/SulphurOG/
          $SCP go.mod go.sum $USER@$HOST:/home/ubuntu/SulphurOG/

          $SSH "chmod +x /home/ubuntu/SulphurOG/sulphurog 2>/dev/null || true"

          # Rebuild da imagem Docker (aplica unrar-free + threads: 16) e sobe
          $SSH "cd /home/ubuntu/SulphurOG && docker compose up -d --build"

          rm -f /tmp/deploy_key
