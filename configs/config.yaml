api:
  port: 8090
  api_key: ${API_KEY}

telegram:
  api_id: ${TG_API_ID}
  api_hash: ${TG_API_HASH}
  phone: ${TG_PHONE}
  session_file: data/session.json
  channels: []

processing:
  temp_dir: /tmp/sulphurog
  part_size_kb: 512
  max_retries: 3
  poll_interval: 30s
  threads: 8
  process_cookies: true
  allowed_extensions:
    - .zip
    - .rar
    - .7z
    - .gz
    - .txt

storage:
  output_dir: data/output

logging:
  level: info